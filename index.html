<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font: 16px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(20rem, calc(100% - 2rem));
      }
      input,
      button {
        height: 40px;
        border: 0;
        border-radius: 8px;
        font: inherit;
      }
      input {
        background: #fff;
        color: #000;
        padding: 0 12px;
      }
      button {
        background: #fff;
        color: #000;
      }
      button:hover {
        transition: none;
      }
      p {
        margin: 0;
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <form>
      <input name="name" placeholder="Name" autocomplete="off" />
      <button type="submit">Hello</button>
      <p id="message"></p>
    </form>
    <script>
      const form = document.querySelector("form")
      const message = document.querySelector("#message")
      form.addEventListener("submit", async (event) => {
        event.preventDefault()
        const name = new FormData(form).get("name")
        const host = window.ox1
        if (!host) {
          message.textContent = "Open this app in 0x1audio."
          return
        }
        try {
          const result = await host.call("hello", { name })
          message.textContent = result.message
        } catch (error) {
          message.textContent = error instanceof Error ? error.message : "Something went wrong."
        }
      })
    </script>
  </body>
</html>
